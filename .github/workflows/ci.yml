name: CI

on:
  push:
    branches: ["main", "master", "codex/document-tools"]
  pull_request:
    branches: ["main", "master", "codex/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Fetch fixtures explicitly; historical evidence is optional.
env:
  GIT_LFS_SKIP_SMUDGE: "1"
  DOTNET_CLI_HOME: ${{ github.workspace }}/artifacts/dotnet-home
  NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-cache
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/artifacts/dotnet-home
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-cache
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch test fixtures from LFS
        shell: bash
        run: git lfs pull --include="e2e/**,tests/**" --exclude=""

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/nuget-cache

      - name: Install document conversion dependencies
        uses: ./.github/actions/linux-tools
        with:
          packages: libreoffice-writer poppler-utils zstd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic CJK font
        uses: ./.github/actions/ci-font

      - name: Check repository storage and fixture payloads
        run: python scripts/check-repository-storage.py --require-materialized e2e --require-materialized tests

      - name: Restore
        run: dotnet restore Ofdrw.Net.sln --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Verify all immutable native supervisor assets
        run: python3 scripts/verify-process-supervisor-assets.py

      - name: Check release notices
        run: python3 scripts/verify-package-artifacts.py --notices-only

      - name: Test package artifact validation
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify retained public table acceptance evidence
        run: |
          git lfs pull --include="docs/validation/public-tables-evidence/**" --exclude=""
          python3 scripts/verify-public-table-evidence.py

      - name: Build and reject new undocumented public API
        run: python3 scripts/check-public-api-docs.py --package-version 0.1.0-preview.8

      - name: Test
        run: dotnet test Ofdrw.Net.sln -c Release --no-build --verbosity minimal --logger trx --results-directory artifacts/test-results --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Generate and render fixed-font OFD, PDF, and PNG
        run: |
          dotnet run --project e2e/Ofdrw.Net.Text.HarfBuzz.E2E/Ofdrw.Net.Text.HarfBuzz.E2E.csproj -c Release --no-build --no-restore -- artifacts/r21-fixed-font
          pdftoppm -f 1 -l 1 -png -singlefile -r 144 artifacts/r21-fixed-font/r21-ascii.pdf artifacts/r21-fixed-font/pdf-page-1
          pdftoppm -f 1 -l 1 -png -singlefile -r 144 artifacts/r21-fixed-font/r21-han.pdf artifacts/r21-fixed-font/han-pdf-page-1
          test -s artifacts/r21-fixed-font/r21-ascii.ofd
          test -s artifacts/r21-fixed-font/r21-ascii.png
          test -s artifacts/r21-fixed-font/pdf-page-1.png
          test -s artifacts/r21-fixed-font/r21-han.ofd
          test -s artifacts/r21-fixed-font/r21-han.png
          test -s artifacts/r21-fixed-font/han-pdf-page-1.png

      - name: Run mandatory original-font geometry and replacement tests without skips
        run: python3 scripts/run-trusted-font-tests.py --no-build --results-directory artifacts/trusted-font-tests

      - name: Pack candidate from the tested Release build
        run: ./scripts/run-converter-package-e2e.sh 0.1.0-preview.8 --pack-only --no-build

      - name: Upload exact candidate packages
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: candidate-packages
          path: artifacts/package-e2e/0.1.0-preview.8/packages
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: test-results
          path: |
            artifacts/test-results
            artifacts/trusted-font-tests
            artifacts/r21-fixed-font

  builtin-docx:
    name: BuiltIn DOCX (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/artifacts/dotnet-home
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-cache
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch test fixtures from LFS
        shell: bash
        run: git lfs pull --include="e2e/**,tests/**" --exclude=""

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/nuget-cache

      - name: Build platform test projects once
        if: matrix.os == 'ubuntu-latest'
        run: dotnet build Ofdrw.Net.PlatformTests.slnf -c Release --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Build full solution on Windows and macOS
        if: matrix.os != 'ubuntu-latest'
        run: dotnet build Ofdrw.Net.sln -c Release --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic CJK font
        uses: ./.github/actions/ci-font

      - name: Install full-suite conversion tools on macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew install poppler
          brew install --cask libreoffice
          pdftoppm -v
          soffice --version

      - name: Cache Windows Poppler downloads
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ofdrw-mamba/pkgs
          key: windows-poppler-v1-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install full-suite conversion tools on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install libreoffice-fresh -y --no-progress
          if ($LASTEXITCODE) { throw 'LibreOffice installation failed' }
          $soffice = Join-Path $env:ProgramFiles 'LibreOffice/program/soffice.com'
          if (-not (Test-Path $soffice)) { throw 'LibreOffice soffice.com was not installed' }
          "OFDRW_LIBREOFFICE_PATH=$soffice" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & $soffice --version
          $bootstrap = Join-Path $env:RUNNER_TEMP 'micromamba.exe'
          Invoke-WebRequest 'https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64.exe' -OutFile $bootstrap
          if ((Get-FileHash $bootstrap -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a6d804394b2418991c4e29562853eaace2f2ce9d9da661a98e74e02e8dbb44b0') { throw 'micromamba hash mismatch' }
          $env:MAMBA_ROOT_PREFIX = Join-Path $env:RUNNER_TEMP 'ofdrw-mamba'
          $prefix = Join-Path $env:RUNNER_TEMP 'ofdrw-poppler'
          & $bootstrap create -y --no-rc --prefix $prefix -c conda-forge 'poppler=26.09.0'
          if ($LASTEXITCODE) { throw 'Poppler installation failed' }
          $bin = Join-Path $prefix 'Library/bin'
          $bin | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "OFDRW_PDFTOPPM=$(Join-Path $bin 'pdftoppm.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $bin 'pdftoppm.exe') -v

      - name: Run full solution tests on Windows and macOS
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test Ofdrw.Net.sln -c Release --no-build --no-restore --logger trx --results-directory artifacts/full-platform-tests --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Run mandatory original-font tests on Windows and macOS
        if: matrix.os != 'ubuntu-latest'
        run: python scripts/run-trusted-font-tests.py --no-build --results-directory artifacts/full-platform-trusted-font-tests

      - name: Upload full platform test results
        if: always() && matrix.os != 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: full-platform-tests-${{ matrix.os }}
          path: |
            artifacts/full-platform-tests
            artifacts/full-platform-trusted-font-tests

      - name: Test pinned HarfBuzz native loading and prelayout
        run: dotnet test tests/Ofdrw.Net.Layout.Tests/Ofdrw.Net.Layout.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~TextPrelayoutTests" --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Test image API on each platform
        run: dotnet test tests/Ofdrw.Net.Converter.Pdf.Tests/Ofdrw.Net.Converter.Pdf.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~ImageIoTests|FullyQualifiedName~ImageDocumentToolsIntegrationTests|FullyQualifiedName~ImageMainIntegrationTests" --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Test image CLI on each platform
        run: dotnet test tests/Ofdrw.Net.Cli.Tests/Ofdrw.Net.Cli.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~ImageCommandTests" --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Test native conversion path safety and replacement publication
        run: dotnet test tests/Ofdrw.Net.Cli.Tests/Ofdrw.Net.Cli.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~Audit004RegressionTests|FullyQualifiedName~TextReplacementCommitNotificationTests" --logger trx --results-directory artifacts/native-path-tests/cli --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Test native external process ownership
        run: dotnet test tests/Ofdrw.Net.Core.Tests/Ofdrw.Net.Core.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~ExternalProcessTests|FullyQualifiedName~Audit024" --logger trx --results-directory artifacts/native-path-tests/processes --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Test native owned file intent
        run: dotnet test tests/Ofdrw.Net.Core.Tests/Ofdrw.Net.Core.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~OfdOwnedFileIntentTests" --logger trx --results-directory artifacts/native-path-tests/core --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Test native replacement file and owned sessions
        run: dotnet test tests/Ofdrw.Net.Packaging.Tests/Ofdrw.Net.Packaging.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~TextReplacementFileSessionTests|FullyQualifiedName~TextReplacementOwnedSessionTests" --logger trx --results-directory artifacts/native-path-tests/packaging --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Upload native path safety results and skip reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: native-path-tests-${{ matrix.os }}
          path: artifacts/native-path-tests

      - name: Test BuiltIn without office applications
        run: dotnet test tests/Ofdrw.Net.Converter.Docx.Tests/Ofdrw.Net.Converter.Docx.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~BuiltIn|FullyQualifiedName~Auto|FullyQualifiedName~Native|FullyQualifiedName~DualLayer" --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Verify original font identity through native OFD and PDF
        env:
          OFDRW_REQUIRE_TRUSTED_FONTS: "1"
        run: >-
          python scripts/prepare-trusted-fonts.py --output-dir artifacts/trusted-fonts &&
          dotnet test tests/Ofdrw.Net.Converter.Pdf.Tests/Ofdrw.Net.Converter.Pdf.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~DocxFontIdentityTests" --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Test embedded font identity and bold compatibility
        run: dotnet test tests/Ofdrw.Net.Converter.Docx.Tests/Ofdrw.Net.Converter.Docx.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~EmbeddedBoldCompatibilityTests|FullyQualifiedName~FontIdentityRegressionTests" --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Run Auto without Word or LibreOffice
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project src/Ofdrw.Net.Cli/Ofdrw.Net.Cli.csproj -c Release --no-build --no-restore -- docx-to-pdf e2e/Ofdrw.Net.Converter.Docx.E2E/testdata/generated-layout.docx "${{ runner.temp }}/builtin-auto.pdf" --docx-engine auto

  package-e2e:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/artifacts/dotnet-home
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-cache
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch test fixtures from LFS
        shell: bash
        run: git lfs pull --include="e2e/**,tests/**" --exclude=""

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/nuget-cache

      - name: Install visual validation tools
        uses: ./.github/actions/linux-tools
        with:
          packages: poppler-utils imagemagick librsvg2-bin zstd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic CJK font
        uses: ./.github/actions/ci-font

      - uses: actions/download-artifact@v4
        with:
          name: candidate-packages
          path: artifacts/candidate-packages

      # Restore license metadata and third-party dependencies, without rebuilding
      # the source solution or repacking the candidate on the consumer runner.
      - name: Restore package validation metadata
        run: dotnet restore Ofdrw.Net.sln --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Consume the exact candidate packages on Linux
        run: ./scripts/run-converter-package-e2e.sh 0.1.0-preview.8 --consume-only --packages-dir artifacts/candidate-packages

      - name: Run document tool API and CLI matrix
        run: |
          mkdir -p artifacts/document-tools-fonts
          cp "$HOME/.fonts/Ofdrw-CI-NotoSansCJKsc-Regular.ttf" "$HOME/.fonts/Ofdrw-CI-Noto-OFL.txt" artifacts/document-tools-fonts/
          ./scripts/run-document-tools-e2e.sh artifacts/document-tools-e2e

      - name: Run native graphics matrix
        run: |
          mkdir -p artifacts/graphics-fonts
          cp "$HOME/.fonts/Ofdrw-CI-NotoSansCJKsc-Regular.ttf" "$HOME/.fonts/Ofdrw-CI-Noto-OFL.txt" artifacts/graphics-fonts/
          ./scripts/run-graphics-e2e.sh artifacts/graphics/current

      - name: Consume optional Skia event adapter from exact local packages
        run: ./scripts/run-skia-package-e2e.sh 0.1.0-preview.8 artifacts/candidate-packages artifacts/skia/package-e2e

      - name: Consume optional PDF vector converter from exact local packages
        run: ./scripts/run-pdf-vector-package-e2e.sh 0.1.0-preview.8 artifacts/candidate-packages artifacts/pdf-vectors/package-e2e

      - name: Upload PDF vector same-source and fallback comparisons
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: pdf-vector-pages
          path: artifacts/pdf-vectors/package-e2e

      - name: Upload Skia adapter comparison pages
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: skia-adapter-pages
          path: artifacts/skia/package-e2e

      - name: Upload native graphics pages
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: native-graphics-pages
          path: artifacts/graphics/current

      - name: Upload document tool matrix
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: document-tools-pages
          path: artifacts/document-tools-e2e

      - name: Upload package manifests and rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: package-e2e-pages
          path: artifacts/package-e2e/0.1.0-preview.8/output

  windows-package-e2e:
    name: Windows package and visual regression
    runs-on: windows-latest
    needs: build-test
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/artifacts/dotnet-home
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-cache
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch visual and font fixtures
        shell: bash
        run: git lfs pull --include="e2e/**,tests/**" --exclude=""
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/nuget-cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Windows rendering tool downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ofdrw-mamba/pkgs
          key: windows-render-v1-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install pinned Windows rendering tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrap = Join-Path $env:RUNNER_TEMP 'micromamba.exe'
          Invoke-WebRequest 'https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64.exe' -OutFile $bootstrap
          if ((Get-FileHash $bootstrap -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a6d804394b2418991c4e29562853eaace2f2ce9d9da661a98e74e02e8dbb44b0') { throw 'micromamba hash mismatch' }
          $env:MAMBA_ROOT_PREFIX = Join-Path $env:RUNNER_TEMP 'ofdrw-mamba'
          $prefix = Join-Path $env:RUNNER_TEMP 'ofdrw-render'
          & $bootstrap create -y --no-rc --prefix $prefix -c conda-forge 'poppler=26.09.0' 'imagemagick=7.1.2_31' 'librsvg=2.62.4'
          if ($LASTEXITCODE) { throw 'Rendering tool installation failed' }
          $bin = Join-Path $prefix 'Library/bin'
          $bin | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          foreach ($pair in @(@('PDFTOPPM','pdftoppm'), @('CONVERT','convert'), @('IDENTIFY','identify'), @('COMPARE','compare'), @('RSVG_CONVERT','rsvg-convert'))) {
            "OFDRW_$($pair[0])=$(Join-Path $bin ($pair[1] + '.exe'))" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          'PANGOCAIRO_BACKEND=fc' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install deterministic CJK font
        uses: ./.github/actions/ci-font
      - uses: actions/download-artifact@v4
        with:
          name: candidate-packages
          path: artifacts/linux-package-candidate
      - name: Consume the exact Linux candidate packages on native Windows
        run: python scripts/run-converter-package-e2e.py 0.1.0-preview.8 --consume-only --packages-dir artifacts/linux-package-candidate --output-dir artifacts/windows-package-e2e
      - name: Upload package identity, logs and page comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: windows-package-e2e-pages
          path: artifacts/windows-package-e2e

  macos-package-e2e:
    name: macOS package and visual regression
    runs-on: macos-latest
    needs: build-test
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/artifacts/dotnet-home
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-cache
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch visual and font fixtures
        shell: bash
        run: git lfs pull --include="e2e/**,tests/**" --exclude=""
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/nuget-cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install macOS rendering tools
        run: |
          brew install poppler imagemagick librsvg
          pdftoppm -v
          rsvg-convert --version
          magick -version
      - name: Install deterministic CJK font
        uses: ./.github/actions/ci-font
      - uses: actions/download-artifact@v4
        with:
          name: candidate-packages
          path: artifacts/linux-package-candidate
      - name: Consume the exact Linux candidate packages on native macOS
        run: python scripts/run-converter-package-e2e.py 0.1.0-preview.8 --consume-only --packages-dir artifacts/linux-package-candidate --output-dir artifacts/macos-package-e2e
      - name: Upload package identity, logs and page comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: macos-package-e2e-pages
          path: artifacts/macos-package-e2e

  password-crypto:
    name: Optional password crypto (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch test fixtures from LFS
        shell: bash
        run: git lfs pull --include="e2e/**,tests/**" --exclude=""
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/nuget-cache
      - name: Password vectors, Java fixtures, atomic failure and selected-entry recovery
        run: dotnet test tests/Ofdrw.Net.Crypto.Password.Tests/Ofdrw.Net.Crypto.Password.Tests.csproj -c Release --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false
      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: "3.12"
      - name: Install password fixture font
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/ci-font
        with:
          directory: artifacts/password-crypto/fonts
      - name: Generate native/default password fixtures and consume actual optional package
        if: matrix.os == 'ubuntu-latest'
        run: |
          export DOTNET_CLI_HOME="$RUNNER_TEMP/password-crypto-dotnet-home" DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1 DOTNET_CLI_TELEMETRY_OPTOUT=1
          dotnet build e2e/Ofdrw.Net.Crypto.Password.E2E/Ofdrw.Net.Crypto.Password.E2E.csproj -c Release --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false
          dotnet e2e/Ofdrw.Net.Crypto.Password.E2E/bin/Release/net10.0/Ofdrw.Net.Crypto.Password.E2E.dll "$PWD" "$PWD/artifacts/password-crypto/current" "$PWD/artifacts/password-crypto/fonts"
          ./scripts/run-password-crypto-e2e.sh
          ./scripts/run-standard-crypto-e2e.sh "$PWD/artifacts/standard-crypto/package-e2e"
      - uses: ./.github/actions/upload-evidence
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: password-crypto-evidence
          path: artifacts/password-crypto
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: standard-crypto-package-evidence
          path: artifacts/standard-crypto/package-e2e/package-manifest.json

  ci-complete:
    name: CI complete
    if: always()
    needs: [build-test, builtin-docx, package-e2e, windows-package-e2e, macos-package-e2e, password-crypto]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI branch to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Incomplete CI jobs: {failed}')
          print('All source, platform, package and crypto gates passed.')
          PY
