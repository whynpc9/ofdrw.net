name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install document conversion dependencies
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils

      - name: Restore
        run: dotnet restore Ofdrw.Net.sln

      - name: Build
        run: dotnet build Ofdrw.Net.sln -c Release --no-restore

      - name: Test
        run: dotnet test Ofdrw.Net.sln -c Release --no-build --verbosity normal

  builtin-docx:
    name: BuiltIn DOCX (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore DOCX tests
        run: dotnet restore tests/Ofdrw.Net.Converter.Docx.Tests/Ofdrw.Net.Converter.Docx.Tests.csproj --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Test BuiltIn without office applications
        run: dotnet test tests/Ofdrw.Net.Converter.Docx.Tests/Ofdrw.Net.Converter.Docx.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName~BuiltIn|FullyQualifiedName~Auto" --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Restore CLI for real Auto fallback probe
        if: matrix.os == 'ubuntu-latest'
        run: dotnet restore src/Ofdrw.Net.Cli/Ofdrw.Net.Cli.csproj --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Run Auto without Word or LibreOffice
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project src/Ofdrw.Net.Cli/Ofdrw.Net.Cli.csproj -c Release --no-restore --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false -- docx-to-pdf e2e/Ofdrw.Net.Converter.Docx.E2E/testdata/generated-layout.docx "${{ runner.temp }}/builtin-auto.pdf" --docx-engine auto

  package-e2e:
    runs-on: ubuntu-latest
    needs: [build-test, builtin-docx]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install visual validation tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick librsvg2-bin

      - name: Run package E2E
        run: ./scripts/run-converter-package-e2e.sh
