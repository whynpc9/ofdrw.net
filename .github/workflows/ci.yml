name: CI

on:
  push:
    branches: ["main", "master", "codex/document-tools"]
  pull_request:
    branches: ["main", "master", "codex/**"]
  workflow_dispatch:
    inputs:
      force_full:
        description: "Run every CI job even when this tree already has a validation marker"
        type: boolean
        default: true
      parallel_tests:
        description: "Trial: run the full-solution test assemblies on multiple MSBuild nodes (forces a full run, uploads no validation marker)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Fetch fixtures explicitly; historical evidence is optional.
env:
  GIT_LFS_SKIP_SMUDGE: "1"
  OFDRW_CI_PACKAGE_VERSION: "0.4.0"
  DOTNET_CLI_HOME: ${{ github.workspace }}/artifacts/dotnet-home
  NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-cache
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  OFDRW_AUDIT025_DIAGNOSTICS_DIRECTORY: ${{ github.workspace }}/artifacts/audit025-diagnostics
  OFDRW_SKIA_DIAGNOSTICS_DIRECTORY: ${{ github.workspace }}/artifacts/skia-font-diagnostics
  # Node flag of the three full-solution `dotnet test` steps. Only a manual
  # parallel_tests trial changes it; pushes, PRs and default dispatches keep -m:1.
  OFDRW_SOLUTION_TEST_NODES: ${{ inputs.parallel_tests && '-m' || '-m:1' }}

jobs:
  # Skips the heavy jobs when this exact tree already passed CI, or when only
  # documentation changed on top of a tree that did (see scripts/ci-plan.py).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read lists validation markers. The LFS cache uses the runner's
    # cache token, and git lfs fetch uses the checkout credentials (contents: read).
    permissions:
      contents: read
      actions: read
    outputs:
      run_full: ${{ steps.plan.outputs.run_full }}
      mode: ${{ steps.plan.outputs.mode }}
      tree: ${{ steps.plan.outputs.tree }}
      base_tree: ${{ steps.plan.outputs.base_tree }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - name: Plan CI work
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # A parallel-test trial is pointless on a reused tree, so it always runs full.
          FORCE_FULL: ${{ inputs.force_full || inputs.parallel_tests }}
        run: python3 scripts/ci-plan.py decide
      # PR caches are visible only to their own PR; main caches to every branch.
      # Warm the fixture cache on main (most pushes skip the heavy jobs) and before
      # a full run, so the parallel jobs restore one entry instead of each
      # downloading. An exact hit is a lookup only. A warming failure must not fail
      # the plan: every consumer still fetches whatever the cache lacks.
      - name: Warm the LFS fixture cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || steps.plan.outputs.run_full == 'true'
        continue-on-error: true
        uses: ./.github/actions/lfs-fixtures
        with:
          warm-only: 'true'
      # Docs-only runs skip build-test, which normally runs this check.
      - name: Check repository storage for docs-only changes
        if: steps.plan.outputs.mode == 'docs-only'
        run: python3 scripts/check-repository-storage.py

  build-test:
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Verify CI candidate version matches source defaults
        shell: bash
        run: |
          python3 - <<'PY_VERSION'
          import os
          import xml.etree.ElementTree as ET
          props = ET.parse('Directory.Build.props').getroot()
          prefix = props.findtext('PropertyGroup/VersionPrefix')
          suffix = props.findtext('PropertyGroup/VersionSuffix')
          source_version = f'{prefix}-{suffix}' if suffix else prefix
          candidate_version = os.environ['OFDRW_CI_PACKAGE_VERSION']
          if candidate_version != source_version:
              raise SystemExit(f'CI candidate version {candidate_version} does not match source defaults {source_version}')
          print(f'CI candidate version matches source defaults: {source_version}')
          PY_VERSION
      - name: Fetch test fixtures from LFS
        uses: ./.github/actions/lfs-fixtures

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/nuget-cache

      # LibreOffice and Poppler are installed only after the no-Office steps below.
      # zstd is needed earlier by the evidence-archive script tests and the
      # public table evidence verifier.
      - name: Install archive tools
        uses: ./.github/actions/linux-tools
        with:
          packages: zstd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic CJK font
        uses: ./.github/actions/ci-font

      - name: Check repository storage and fixture payloads
        run: python scripts/check-repository-storage.py --require-materialized e2e --require-materialized tests

      - name: Restore
        run: dotnet restore Ofdrw.Net.sln --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Reject NuGet advisories outside the reviewed allowlist
        run: python3 scripts/check-nuget-advisories.py

      - name: Verify all immutable native supervisor assets
        run: python3 scripts/verify-process-supervisor-assets.py

      - name: Check release notices
        run: python3 scripts/verify-package-artifacts.py --notices-only

      - name: Test package artifact validation
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify retained public table acceptance evidence
        run: |
          git lfs pull --include="docs/validation/public-tables-evidence/**" --exclude=""
          python3 scripts/verify-public-table-evidence.py

      - name: Build and reject new undocumented public API
        run: python3 scripts/check-public-api-docs.py --package-version ${{ env.OFDRW_CI_PACKAGE_VERSION }}

      # No-Office leg: engine auto-selection and fallback while neither Word nor
      # LibreOffice is installed. Every other test also runs in the full Test step
      # below, against the same build, after the tools are installed.
      - name: Test BuiltIn without office applications
        run: |
          # Same locations as LibreOfficeExecutableResolver on Linux.
          if command -v soffice || command -v libreoffice || [[ -n "${OFDRW_LIBREOFFICE_PATH:-}" ]] \
            || compgen -G '/usr/lib*/libreoffice/program/soffice' || compgen -G '/opt/*[Ll]ibre[Oo]ffice*/program/soffice'; then
            echo "LibreOffice is visible before the no-Office tests." >&2; exit 1
          fi
          command -v pdftoppm || echo "pdftoppm: not installed"
          dotnet test tests/Ofdrw.Net.Converter.Docx.Tests/Ofdrw.Net.Converter.Docx.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~BuiltIn|FullyQualifiedName~Auto|FullyQualifiedName~Native|FullyQualifiedName~DualLayer" --logger trx --results-directory artifacts/no-office-tests --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Run Auto without Word or LibreOffice
        run: dotnet run --project src/Ofdrw.Net.Cli/Ofdrw.Net.Cli.csproj -c Release --no-build --no-restore -- docx-to-pdf e2e/Ofdrw.Net.Converter.Docx.E2E/testdata/generated-layout.docx "${{ runner.temp }}/builtin-auto.pdf" --docx-engine auto

      - name: Install document conversion dependencies
        uses: ./.github/actions/linux-tools
        with:
          packages: libreoffice-writer poppler-utils

      - name: Compile source-referenced e2e harnesses
        run: |
          for p in Graphics.R09.E2E Signatures.Appearance.Visual.E2E TypedObjects.E2E Signatures.Scope.E2E; do
            dotnet build "e2e/Ofdrw.Net.$p/Ofdrw.Net.$p.csproj" -c Release --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false
          done

      - name: Retain bounded allocation-counter diagnostics
        run: python3 scripts/run-audit025-diagnostic.py

      - name: Test
        run: dotnet test Ofdrw.Net.sln -c Release --no-build --verbosity minimal --logger trx --results-directory artifacts/test-results --disable-build-servers ${{ env.OFDRW_SOLUTION_TEST_NODES }} /nodeReuse:false /p:UseSharedCompilation=false

      - name: Generate and render fixed-font OFD, PDF, and PNG
        run: |
          dotnet run --project e2e/Ofdrw.Net.Text.HarfBuzz.E2E/Ofdrw.Net.Text.HarfBuzz.E2E.csproj -c Release --no-build --no-restore -- artifacts/r21-fixed-font
          pdftoppm -f 1 -l 1 -png -singlefile -r 144 artifacts/r21-fixed-font/r21-ascii.pdf artifacts/r21-fixed-font/pdf-page-1
          pdftoppm -f 1 -l 1 -png -singlefile -r 144 artifacts/r21-fixed-font/r21-han.pdf artifacts/r21-fixed-font/han-pdf-page-1
          test -s artifacts/r21-fixed-font/r21-ascii.ofd
          test -s artifacts/r21-fixed-font/r21-ascii.png
          test -s artifacts/r21-fixed-font/pdf-page-1.png
          test -s artifacts/r21-fixed-font/r21-han.ofd
          test -s artifacts/r21-fixed-font/r21-han.png
          test -s artifacts/r21-fixed-font/han-pdf-page-1.png
          for name in text-paragraph-justify text-paragraph-rtl-center; do
            test -s "artifacts/r21-fixed-font/$name.ofd"
            pdftoppm -png -r 144 "artifacts/r21-fixed-font/$name.pdf" "artifacts/r21-fixed-font/$name-page"
            test -s "artifacts/r21-fixed-font/$name-page-1.png"
          done
          test -s artifacts/r21-fixed-font/text-paragraph-receipt.json

      - name: Run mandatory original-font geometry and replacement tests without skips
        run: python3 scripts/run-trusted-font-tests.py --no-build --results-directory artifacts/trusted-font-tests

      # The full Test step runs these with a discovered host font (or skips them);
      # this run requires the pinned trusted fixture. It reuses the bundle that
      # run-trusted-font-tests.py prepared and writes no TRX into that gate's directory.
      - name: Test DOCX CJK viewer-local font declarations with the trusted fixture
        # The prepared bundle lives in a digest-named subdirectory; use the paths the script reports.
        run: |
          eval "$(python scripts/prepare-trusted-fonts.py --output-dir artifacts/trusted-fonts | python -c 'import json, shlex, sys; [print("export " + k + "=" + shlex.quote(v)) for k, v in json.load(sys.stdin)["environment"].items()]')"
          test -f "$OFDRW_TEST_TRUSTED_CJK_FONT"
          dotnet test tests/Ofdrw.Net.Converter.Docx.Tests/Ofdrw.Net.Converter.Docx.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~ViewerLocalCjk" --logger trx --results-directory artifacts/viewer-local-cjk-tests --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Pack candidate from the tested Release build
        run: ./scripts/run-converter-package-e2e.sh ${{ env.OFDRW_CI_PACKAGE_VERSION }} --pack-only --no-build

      # Optional package: kept out of the thirteen-package default candidate feed.
      - name: Pack optional SES interop package from the tested Release build
        run: dotnet pack src/Ofdrw.Net.Signatures.SesInterop/Ofdrw.Net.Signatures.SesInterop.csproj -c Release --no-build --no-restore -o artifacts/ses-interop-candidate -p:Version=${{ env.OFDRW_CI_PACKAGE_VERSION }} -p:PackageVersion=${{ env.OFDRW_CI_PACKAGE_VERSION }} --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false --nologo

      - name: Upload exact candidate packages
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: candidate-packages
          compression-level: 0 # nupkg/snupkg payloads are already compressed.
          path: artifacts/package-e2e/${{ env.OFDRW_CI_PACKAGE_VERSION }}/packages
          if-no-files-found: error

      - name: Upload optional SES interop package
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: ses-interop-package
          compression-level: 0 # nupkg/snupkg payloads are already compressed.
          path: artifacts/ses-interop-candidate
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: test-results
          path: |
            artifacts/test-results
            artifacts/no-office-tests
            artifacts/trusted-font-tests
            artifacts/viewer-local-cjk-tests
            artifacts/r21-fixed-font
            artifacts/audit025-diagnostics
            artifacts/skia-font-diagnostics

  builtin-docx:
    name: BuiltIn DOCX (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the same suite in build-test; its no-Office steps run there
        # before LibreOffice and Poppler are installed.
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch test fixtures from LFS
        uses: ./.github/actions/lfs-fixtures

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/nuget-cache

      - name: Build full solution on Windows and macOS
        run: dotnet build Ofdrw.Net.sln -c Release --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic CJK font
        uses: ./.github/actions/ci-font

      - name: Install full-suite conversion tools on macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew install poppler
          brew install --cask libreoffice
          pdftoppm -v
          soffice --version

      - name: Cache Windows Poppler downloads
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ofdrw-mamba/pkgs
          key: windows-poppler-v2-${{ runner.arch }}-micromamba-2.9.0-0-poppler-26.09.0

      - name: Install full-suite conversion tools on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install libreoffice-fresh -y --no-progress
          if ($LASTEXITCODE) { throw 'LibreOffice installation failed' }
          $soffice = Join-Path $env:ProgramFiles 'LibreOffice/program/soffice.com'
          if (-not (Test-Path $soffice)) { throw 'LibreOffice soffice.com was not installed' }
          "OFDRW_LIBREOFFICE_PATH=$soffice" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & $soffice --version
          $bootstrap = Join-Path $env:RUNNER_TEMP 'micromamba.exe'
          Invoke-WebRequest 'https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64.exe' -OutFile $bootstrap
          if ((Get-FileHash $bootstrap -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a6d804394b2418991c4e29562853eaace2f2ce9d9da661a98e74e02e8dbb44b0') { throw 'micromamba hash mismatch' }
          $env:MAMBA_ROOT_PREFIX = Join-Path $env:RUNNER_TEMP 'ofdrw-mamba'
          $prefix = Join-Path $env:RUNNER_TEMP 'ofdrw-poppler'
          & $bootstrap create -y --no-rc --prefix $prefix -c conda-forge 'poppler=26.09.0'
          if ($LASTEXITCODE) { throw 'Poppler installation failed' }
          $bin = Join-Path $prefix 'Library/bin'
          $bin | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "OFDRW_PDFTOPPM=$(Join-Path $bin 'pdftoppm.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $bin 'pdftoppm.exe') -v

      - name: Retain bounded allocation-counter diagnostics on Windows and macOS
        run: python scripts/run-audit025-diagnostic.py

      # Windows/macOS native-path results and skip reasons are retained in this TRX.
      - name: Run full solution tests on Windows and macOS
        run: dotnet test Ofdrw.Net.sln -c Release --no-build --no-restore --logger trx --results-directory artifacts/full-platform-tests --disable-build-servers ${{ env.OFDRW_SOLUTION_TEST_NODES }} /nodeReuse:false /p:UseSharedCompilation=false

      - name: Run mandatory original-font tests on Windows and macOS
        run: python scripts/run-trusted-font-tests.py --no-build --results-directory artifacts/full-platform-trusted-font-tests

      - name: Upload full platform test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: full-platform-tests-${{ matrix.os }}
          path: |
            artifacts/full-platform-tests
            artifacts/full-platform-trusted-font-tests
            artifacts/audit025-diagnostics
            artifacts/skia-font-diagnostics

  package-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch test fixtures from LFS
        uses: ./.github/actions/lfs-fixtures

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/nuget-cache

      - name: Install visual validation tools
        uses: ./.github/actions/linux-tools
        with:
          packages: poppler-utils imagemagick librsvg2-bin zstd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic CJK font
        uses: ./.github/actions/ci-font

      - uses: actions/download-artifact@v4
        with:
          name: candidate-packages
          path: artifacts/candidate-packages
      - uses: actions/download-artifact@v4
        with:
          name: ses-interop-package
          path: artifacts/ses-interop-candidate

      # Restore license metadata and third-party dependencies, without rebuilding
      # the source solution or repacking the candidate on the consumer runner.
      - name: Restore package validation metadata
        run: dotnet restore Ofdrw.Net.sln --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Consume the exact candidate packages on Linux
        run: ./scripts/run-converter-package-e2e.sh ${{ env.OFDRW_CI_PACKAGE_VERSION }} --consume-only --packages-dir artifacts/candidate-packages

      # SES consumer of the same candidate: verifies the default feed's manifest before
      # and after use and binds the separately packed optional package to it.
      # Nothing is rebuilt or repacked; it only copies the feed into its evidence.
      - name: Consume optional SES interop package and render exact OFD samples
        run: |
          mkdir -p artifacts/ses-interop/fonts
          cp "$HOME/.fonts/Ofdrw-CI-NotoSansCJKsc-Regular.ttf" "$HOME/.fonts/Ofdrw-CI-Noto-OFL.txt" artifacts/ses-interop/fonts/
          bash scripts/run-ses-interop-e2e.sh artifacts/ses-interop/e2e ${{ env.OFDRW_CI_PACKAGE_VERSION }} --packages-dir artifacts/candidate-packages --optional-packages-dir artifacts/ses-interop-candidate

      - name: Compile package-referenced e2e harnesses against the candidate
        run: ./scripts/build-e2e-harnesses.sh ${{ env.OFDRW_CI_PACKAGE_VERSION }} artifacts/candidate-packages
      - uses: ./.github/actions/text-readers
      - name: Verify original mixed-text glyphs and independent physical word bounds on Linux
        run: '"$OFDRW_TEXT_READER_PYTHON" scripts/validation/text-mixed/check-export-batch.py artifacts/package-e2e/${{ env.OFDRW_CI_PACKAGE_VERSION }}/output/text-prelayout --output artifacts/package-e2e/${{ env.OFDRW_CI_PACKAGE_VERSION }}/output/text-independent'

      - name: Run document tool API and CLI matrix
        run: |
          mkdir -p artifacts/document-tools-fonts
          cp "$HOME/.fonts/Ofdrw-CI-NotoSansCJKsc-Regular.ttf" "$HOME/.fonts/Ofdrw-CI-Noto-OFL.txt" artifacts/document-tools-fonts/
          ./scripts/run-document-tools-e2e.sh artifacts/document-tools-e2e

      - name: Run native graphics matrix
        run: |
          mkdir -p artifacts/graphics-fonts
          cp "$HOME/.fonts/Ofdrw-CI-NotoSansCJKsc-Regular.ttf" "$HOME/.fonts/Ofdrw-CI-Noto-OFL.txt" artifacts/graphics-fonts/
          ./scripts/run-graphics-e2e.sh artifacts/graphics/current

      - name: Consume optional Skia event adapter from exact local packages
        run: ./scripts/run-skia-package-e2e.sh ${{ env.OFDRW_CI_PACKAGE_VERSION }} artifacts/candidate-packages artifacts/skia/package-e2e

      - name: Consume optional PDF vector converter from exact local packages
        run: ./scripts/run-pdf-vector-package-e2e.sh ${{ env.OFDRW_CI_PACKAGE_VERSION }} artifacts/candidate-packages artifacts/pdf-vectors/package-e2e

      - name: Upload SES interop evidence
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: ses-interop-evidence
          path: artifacts/ses-interop

      - name: Upload PDF vector same-source and fallback comparisons
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: pdf-vector-pages
          path: artifacts/pdf-vectors/package-e2e

      - name: Upload Skia adapter comparison pages
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: skia-adapter-pages
          path: artifacts/skia/package-e2e

      - name: Upload native graphics pages
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: native-graphics-pages
          path: artifacts/graphics/current

      - name: Upload document tool matrix
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: document-tools-pages
          path: artifacts/document-tools-e2e

      - name: Upload package manifests and rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: package-e2e-pages
          path: artifacts/package-e2e/${{ env.OFDRW_CI_PACKAGE_VERSION }}/output

  windows-package-e2e:
    name: Windows package and visual regression
    runs-on: windows-latest
    timeout-minutes: 90
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch visual and font fixtures
        uses: ./.github/actions/lfs-fixtures
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/nuget-cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Windows rendering tool downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ofdrw-mamba/pkgs
          key: windows-render-v2-${{ runner.arch }}-micromamba-2.9.0-0-poppler-26.09.0-imagemagick-7.1.2_31-librsvg-2.62.4
      - name: Install pinned Windows rendering tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrap = Join-Path $env:RUNNER_TEMP 'micromamba.exe'
          Invoke-WebRequest 'https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64.exe' -OutFile $bootstrap
          if ((Get-FileHash $bootstrap -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a6d804394b2418991c4e29562853eaace2f2ce9d9da661a98e74e02e8dbb44b0') { throw 'micromamba hash mismatch' }
          $env:MAMBA_ROOT_PREFIX = Join-Path $env:RUNNER_TEMP 'ofdrw-mamba'
          $prefix = Join-Path $env:RUNNER_TEMP 'ofdrw-render'
          & $bootstrap create -y --no-rc --prefix $prefix -c conda-forge 'poppler=26.09.0' 'imagemagick=7.1.2_31' 'librsvg=2.62.4'
          if ($LASTEXITCODE) { throw 'Rendering tool installation failed' }
          $bin = Join-Path $prefix 'Library/bin'
          $bin | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          foreach ($pair in @(@('PDFTOPPM','pdftoppm'), @('CONVERT','convert'), @('IDENTIFY','identify'), @('COMPARE','compare'), @('RSVG_CONVERT','rsvg-convert'))) {
            "OFDRW_$($pair[0])=$(Join-Path $bin ($pair[1] + '.exe'))" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          'PANGOCAIRO_BACKEND=fc' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install deterministic CJK font
        uses: ./.github/actions/ci-font
      - uses: actions/download-artifact@v4
        with:
          name: candidate-packages
          path: artifacts/linux-package-candidate
      - name: Consume the exact Linux candidate packages on native Windows
        run: python scripts/run-converter-package-e2e.py ${{ env.OFDRW_CI_PACKAGE_VERSION }} --consume-only --packages-dir artifacts/linux-package-candidate --output-dir artifacts/windows-package-e2e
      - uses: ./.github/actions/text-readers
      - name: Verify original mixed-text glyphs and independent physical word bounds on Windows
        run: '& $env:OFDRW_TEXT_READER_PYTHON scripts/validation/text-mixed/check-export-batch.py artifacts/windows-package-e2e/text-prelayout --output artifacts/windows-package-e2e/text-independent'
      - name: Upload package identity, logs and page comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: windows-package-e2e-pages
          path: artifacts/windows-package-e2e

  macos-package-e2e:
    name: macOS package and visual regression
    runs-on: macos-latest
    timeout-minutes: 90
    needs: build-test
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch visual and font fixtures
        uses: ./.github/actions/lfs-fixtures
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/nuget-cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install macOS rendering tools
        run: |
          brew install poppler imagemagick librsvg
          pdftoppm -v
          rsvg-convert --version
          magick -version
      - name: Install deterministic CJK font
        uses: ./.github/actions/ci-font
      - uses: actions/download-artifact@v4
        with:
          name: candidate-packages
          path: artifacts/linux-package-candidate
      - name: Consume the exact Linux candidate packages on native macOS
        run: python scripts/run-converter-package-e2e.py ${{ env.OFDRW_CI_PACKAGE_VERSION }} --consume-only --packages-dir artifacts/linux-package-candidate --output-dir artifacts/macos-package-e2e
      - uses: ./.github/actions/text-readers
      - name: Verify original mixed-text glyphs and native PDFKit logical reading on macOS
        run: '"$OFDRW_TEXT_READER_PYTHON" scripts/validation/text-mixed/check-export-batch.py artifacts/macos-package-e2e/text-prelayout --output artifacts/macos-package-e2e/text-independent --pdfkit'
      - name: Upload package identity, logs and page comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: macos-package-e2e-pages
          path: artifacts/macos-package-e2e

  password-crypto:
    # Password unit tests run in the full solution on all three platforms.
    # Only Linux has additional fixture generation and isolated package consumers.
    name: Optional password crypto package E2E
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch test fixtures from LFS
        uses: ./.github/actions/lfs-fixtures
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/nuget-cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install password fixture font
        uses: ./.github/actions/ci-font
        with:
          directory: artifacts/password-crypto/fonts
      - name: Generate native/default password fixtures and consume actual optional package
        run: |
          export DOTNET_CLI_HOME="$RUNNER_TEMP/password-crypto-dotnet-home" DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1 DOTNET_CLI_TELEMETRY_OPTOUT=1
          dotnet build e2e/Ofdrw.Net.Crypto.Password.E2E/Ofdrw.Net.Crypto.Password.E2E.csproj -c Release --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false
          dotnet e2e/Ofdrw.Net.Crypto.Password.E2E/bin/Release/net10.0/Ofdrw.Net.Crypto.Password.E2E.dll "$PWD" "$PWD/artifacts/password-crypto/current" "$PWD/artifacts/password-crypto/fonts"
          ./scripts/run-password-crypto-e2e.sh
          ./scripts/run-standard-crypto-e2e.sh "$PWD/artifacts/standard-crypto/package-e2e"
      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: password-crypto-evidence
          path: artifacts/password-crypto
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          name: standard-crypto-package-evidence
          path: artifacts/standard-crypto/package-e2e/package-manifest.json

  ci-complete:
    name: CI complete
    if: always()
    needs: [changes, build-test, builtin-docx, package-e2e, windows-package-e2e, macos-package-e2e, password-crypto]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CI planner
        uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: scripts/ci-plan.py
          sparse-checkout-cone-mode: false
      # Full plan: every other needed job succeeded. Skip plan: every other
      # needed job was skipped. Anything else fails this check.
      - name: Require every CI branch to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-plan.py gate
      # A parallel_tests trial changes how the suite runs, so it never vouches for a tree.
      - name: Write validation marker
        if: (needs.changes.outputs.mode == 'full' || needs.changes.outputs.mode == 'docs-only') && !inputs.parallel_tests
        env:
          TREE: ${{ needs.changes.outputs.tree }}
          MODE: ${{ needs.changes.outputs.mode }}
          BASE_TREE: ${{ needs.changes.outputs.base_tree }}
        run: python3 scripts/ci-plan.py write-marker --output "$RUNNER_TEMP/ci-validated/marker.json"
      - name: Upload validation marker
        if: (needs.changes.outputs.mode == 'full' || needs.changes.outputs.mode == 'docs-only') && !inputs.parallel_tests
        uses: actions/upload-artifact@v4
        with:
          name: ci-validated-${{ needs.changes.outputs.tree }}
          path: ${{ runner.temp }}/ci-validated/marker.json
          retention-days: 30
          overwrite: true
          if-no-files-found: error
