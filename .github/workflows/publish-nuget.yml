name: Publish NuGet

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release license metadata
        shell: bash
        run: |
          if [ ! -f LICENSE ] && [ ! -f LICENSE.md ]; then
            echo "NuGet publication is blocked: select and add the repository license first."
            exit 1
          fi
          if ! grep -Eq "<PackageLicense(Expression|File)>" Directory.Build.props; then
            echo "NuGet publication is blocked: add PackageLicenseExpression or PackageLicenseFile."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install document conversion dependencies
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils imagemagick librsvg2-bin

      - name: Resolve version from tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$ ]]; then
            echo "Release tag must use v<SemVer>, for example v0.1.0-preview.5: $TAG_NAME"
            exit 1
          fi
          PACKAGE_VERSION="${BASH_REMATCH[1]}"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "Resolved package version: $PACKAGE_VERSION"

      - name: Restore
        run: dotnet restore Ofdrw.Net.sln

      - name: Build
        run: dotnet build Ofdrw.Net.sln -c Release --no-restore -p:Version=${{ env.PACKAGE_VERSION }} -p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Test
        run: dotnet test Ofdrw.Net.sln -c Release --no-build --verbosity normal

      - name: Pack SDK packages
        run: dotnet pack Ofdrw.Net.sln -c Release --no-build --no-restore -o artifacts/nuget -p:Version=${{ env.PACKAGE_VERSION }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Consume the exact release artifacts
        run: ./scripts/run-converter-package-e2e.sh "${{ env.PACKAGE_VERSION }}" --consume-only --packages-dir artifacts/nuget --output-dir artifacts/release-validation

      - name: Upload package manifest and validation pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation
          path: |
            artifacts/release-validation
            artifacts/nuget/package-manifest.json

      - name: List artifacts
        run: ls -lh artifacts/nuget

      - name: Publish packages and symbols
        shell: bash
        run: |
          python3 scripts/verify-package-artifacts.py artifacts/nuget "${{ env.PACKAGE_VERSION }}" --verify-manifest
          shopt -s nullglob
          for package in artifacts/nuget/*.nupkg; do
            if [[ "$package" == *.snupkg ]]; then
              continue
            fi
            dotnet nuget push "$package" --source "https://api.nuget.org/v3/index.json" --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
          done
