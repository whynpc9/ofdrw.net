name: Publish NuGet

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (for example v0.1.0-preview.10)"
        required: true
        type: string

# Fetch fixtures explicitly; historical evidence is optional.
env:
  GIT_LFS_SKIP_SMUDGE: "1"

concurrency:
  group: publish-nuget-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/artifacts/dotnet-home
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-cache
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      package_version: ${{ steps.release.outputs.package_version }}
      tag: ${{ steps.release.outputs.tag }}
      artifact_id: ${{ steps.release-packages.outputs.artifact-id }}

    steps:
      - name: Resolve existing release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual release recovery must run from main."
              exit 1
            fi
            TAG_NAME="$REQUESTED_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            echo "Release requires a tag push or a manual dispatch from main."
            exit 1
          fi
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$ ]]; then
            echo "Release tag must use v<SemVer>, for example v0.1.0-preview.10."
            exit 1
          fi
          PACKAGE_VERSION="${BASH_REMATCH[1]}"
          # Require an existing tag; resolve annotated tags to their immutable commit.
          TARGET="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq '[.object.type, .object.sha] | @tsv')"
          IFS=$'\t' read -r OBJECT_TYPE COMMIT_SHA <<< "$TARGET"
          while [[ "$OBJECT_TYPE" == "tag" ]]; do
            TARGET="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$COMMIT_SHA" --jq '[.object.type, .object.sha] | @tsv')"
            IFS=$'\t' read -r OBJECT_TYPE COMMIT_SHA <<< "$TARGET"
          done
          if [[ "$OBJECT_TYPE" != "commit" || ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release tag must resolve to a commit."
            exit 1
          fi
          printf '%s\n' "tag=$TAG_NAME" "package_version=$PACKAGE_VERSION" "commit=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "Resolved $TAG_NAME to $COMMIT_SHA (package $PACKAGE_VERSION)."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.commit }}
          lfs: false

      - name: Record release run provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          mkdir -p artifacts/release-validation
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          keys = ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "GITHUB_WORKFLOW_SHA", "RELEASE_TAG", "RELEASE_COMMIT")
          Path("artifacts/release-validation/release-run-provenance.json").write_text(
              json.dumps({key: os.environ[key] for key in keys}, indent=2) + "\n")
          PY

      - name: Require CI and SES success on the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          require_check() {
            local workflow="$1" required="$2" run suite_id status conclusion checks
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=push&head_sha=$RELEASE_COMMIT&per_page=1" \
              --jq '.workflow_runs[0] | [.check_suite_id, .status, .conclusion] | @tsv')"
            IFS=$'\t' read -r suite_id status conclusion <<< "$run"
            if [[ ! "$suite_id" =~ ^[0-9]+$ || "$status" != completed || "$conclusion" != success ]]; then
              echo "Release commit $RELEASE_COMMIT requires a successful $workflow push run on main (found: ${run:-none})."
              return 1
            fi
            checks="$(gh api "repos/$GITHUB_REPOSITORY/check-suites/$suite_id/check-runs?per_page=100&filter=latest" --paginate \
              --jq '.check_runs[] | select(.app.slug == "github-actions") | [.name, .head_sha, .status, .conclusion] | @tsv')"
            if ! grep -Fxq "$required"$'\t'"$RELEASE_COMMIT"$'\t'completed$'\t'success <<< "$checks"; then
              echo "Release commit $RELEASE_COMMIT has no successful '$required' check in $workflow suite $suite_id."
              return 1
            fi
            echo "Verified '$required' in $workflow suite $suite_id for $RELEASE_COMMIT."
          }
          require_check ci.yml "CI complete"
          require_check ses-interop.yml ses-interop

      - name: Fetch test fixtures from LFS
        shell: bash
        run: git lfs pull --include="e2e/**,tests/**" --exclude=""

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/nuget-cache

      - name: Install document conversion dependencies
        uses: ./.github/actions/linux-tools
        with:
          packages: libreoffice-writer poppler-utils imagemagick librsvg2-bin zstd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic CJK font
        uses: ./.github/actions/ci-font

      - name: Restore
        run: dotnet restore Ofdrw.Net.sln --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Reject NuGet advisories outside the allowlist
        run: python3 scripts/check-nuget-advisories.py

      - name: Test repository scripts
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify release license and resolved dependency inventory
        run: python3 scripts/verify-package-artifacts.py --notices-only

      - name: Build and reject new undocumented public API
        run: python3 scripts/check-public-api-docs.py --package-version "${{ env.PACKAGE_VERSION }}"

      - name: Run mandatory original-font geometry and replacement tests without skips
        run: python3 scripts/run-trusted-font-tests.py --no-build --results-directory artifacts/release-trusted-font-tests

      - name: Test
        run: dotnet test Ofdrw.Net.sln -c Release --no-build --verbosity minimal --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false

      - name: Pack SDK packages
        shell: bash
        run: |
          DEFAULT_PRODUCT_LIST="$(mktemp)"
          trap 'rm -f "$DEFAULT_PRODUCT_LIST"' EXIT
          python3 - scripts > "$DEFAULT_PRODUCT_LIST" <<'PY_PACKAGES'
          import sys
          sys.path.insert(0, sys.argv[1])
          from importlib import import_module
          print('\n'.join(import_module('verify-package-artifacts').PACKAGES))
          PY_PACKAGES
          while IFS= read -r product; do
            dotnet pack "src/$product/$product.csproj" -c Release --no-build --no-restore -o artifacts/nuget -p:Version=${{ env.PACKAGE_VERSION }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} --disable-build-servers -m:1 /nodeReuse:false /p:UseSharedCompilation=false
          done < "$DEFAULT_PRODUCT_LIST"

      - name: Consume the exact release artifacts
        run: ./scripts/run-converter-package-e2e.sh "${{ env.PACKAGE_VERSION }}" --consume-only --packages-dir artifacts/nuget --output-dir artifacts/release-validation

      - name: Upload package manifest and validation pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_attempt }}
          path: |
            artifacts/release-validation
            artifacts/release-trusted-font-tests
            artifacts/nuget/package-manifest.json

      - name: List artifacts
        run: ls -lh artifacts/nuget

      - name: Require candidate-bound macOS Preview acceptance
        run: python3 scripts/verify-preview-record.py "${{ env.PACKAGE_VERSION }}"

      - name: Verify package manifest
        run: python3 scripts/verify-package-artifacts.py artifacts/nuget "${{ env.PACKAGE_VERSION }}" --verify-manifest

      - name: Record package checksums
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          cd artifacts/nuget
          sha256sum -- *.nupkg *.snupkg > SHA256SUMS

      - name: Upload validated packages
        id: release-packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ github.run_attempt }}
          compression-level: 0 # nupkg/snupkg payloads are already compressed.
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            artifacts/nuget/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download validated packages
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: packages
          merge-multiple: true

      - name: Verify package checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          cd packages
          # Recompute the whole inventory to reject extra packages as well as changed or missing files.
          sha256sum -- *.nupkg *.snupkg | diff -u SHA256SUMS -
          echo "Verified package files for $RELEASE_TAG (version $PACKAGE_VERSION)."

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: whynpc

      - name: Publish packages and symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in packages/*.nupkg; do
            dotnet nuget push "$package" --source "https://api.nuget.org/v3/index.json" --api-key "$NUGET_API_KEY" --skip-duplicate
          done
