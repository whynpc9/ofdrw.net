name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/content/**', 'docs/site/**', 'scripts/check-documentation.py', '.github/workflows/docs-pages.yml']
  pull_request:
    paths: ['docs/content/**', 'docs/site/**', 'scripts/check-documentation.py', '.github/workflows/docs-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
        working-directory: docs/site
      - run: npm run build
        working-directory: docs/site
      - run: npm run typecheck
        working-directory: docs/site
      - run: npm run check
        working-directory: docs/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
