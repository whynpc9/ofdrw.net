name: Pinned R22 independent readers
description: Isolate reader dependencies from the deterministic CI font generator
runs:
  using: composite
  steps:
    - name: Install independent reader environment
      shell: bash
      run: |
        python - <<'PY'
        import os, pathlib, subprocess, venv
        root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ofdrw-r22-readers'
        venv.EnvBuilder(with_pip=True).create(root)
        executable = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
        subprocess.run([str(executable), '-m', 'pip', 'install', 'pypdf==6.21.2', 'fonttools==4.68.0'], check=True)
        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
            stream.write(f'OFDRW_R22_PYTHON={executable}\n')
        PY
