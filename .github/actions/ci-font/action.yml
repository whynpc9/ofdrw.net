name: Install deterministic CI font
description: Cache the pinned static font and verify its bytes on every use.
inputs:
  directory:
    description: Optional isolated font directory
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: artifacts/ci-font-cache
        key: ci-font-v1-${{ hashFiles('scripts/install-ci-fonts.py') }}
    - shell: bash
      env:
        FONT_DIRECTORY: ${{ inputs.directory }}
      run: |
        python -m pip install fonttools==4.59.2
        args=(--cache-dir artifacts/ci-font-cache)
        if [[ -n "$FONT_DIRECTORY" ]]; then args+=(--directory "$FONT_DIRECTORY"); fi
        python scripts/install-ci-fonts.py "${args[@]}"
